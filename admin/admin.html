<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت MyGoogle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin:0;
    font-family: Arial,Tahoma,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container {
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

h1 {
    text-align:center;
    margin-bottom:30px;
}

.card {
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    margin-bottom:25px;
}

input,textarea {
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

textarea {
    min-height:100px;
}

button {
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    background:#222;
    color:white;
}

.website {
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-top:12px;
}

.website-title {
    font-size:20px;
    font-weight:bold;
}

.website-url {
    direction:ltr;
    text-align:left;
    margin:8px 0;
}

.delete-button {
    background:#d32f2f;
}

.edit-button {
    background:#1976d2;
}

.loading {
    text-align:center;
    color:#777;
}

.error {
    color:red;
}
</style>

</head>


<body>

<div class="container">

<h1>
پنل مدیریت MyGoogle
</h1>


<div class="card">

<h2>
تعداد سایت‌ها
</h2>

<div id="websiteCount">
0
</div>

</div>


<div class="card">

<h2>
اضافه کردن سایت
</h2>


<label>
عنوان
</label>

<input id="titleInput" type="text">


<label>
آدرس
</label>

<input id="urlInput" type="text">


<label>
توضیحات
</label>

<textarea id="descriptionInput"></textarea>


<button onclick="addWebsite()">
ذخیره سایت
</button>


<div id="message"></div>

</div>


<div class="card">

<h2>
سایت‌های ذخیره شده
</h2>


<div id="websites">

<div class="loading">
در حال دریافت سایت‌ها...
</div>

</div>


</div>


</div>


<script>


const API_URL =
"https://mygoogle-production.up.railway.app";
async function loadWebsites() {

    const box = document.getElementById("websites");

    box.innerHTML = `
        <div class="loading">
            در حال دریافت سایت‌ها...
        </div>
    `;

    try {

        const response = await fetch(
            API_URL + "/api/websites"
        );


        if (!response.ok) {
            throw new Error("خطا در دریافت اطلاعات");
        }


        const data = await response.json();


        document.getElementById(
            "websiteCount"
        ).textContent = data.length;


        box.innerHTML = "";


        if(data.length === 0){

            box.innerHTML = `
            <div class="loading">
            سایتی وجود ندارد
            </div>
            `;

            return;
        }


        data.forEach(site => {


            const div = document.createElement("div");

            div.className="website";


            div.innerHTML = `

            <div class="website-title">
            ${escapeHTML(site.title)}
            </div>


            <div class="website-url">
            ${escapeHTML(site.url)}
            </div>


            <div>
            ${escapeHTML(site.description || "")}
            </div>


            <br>


            <button 
            class="edit-button"
            onclick="editWebsite(${site.id})">
            ویرایش
            </button>


            <button 
            class="delete-button"
            onclick="deleteWebsite(${site.id})">
            حذف
            </button>

            `;


            box.appendChild(div);


        });


    }

    catch(error){

        console.error(error);


        box.innerHTML = `

        <div class="error">

        اتصال به Backend برقرار نشد.

        <br><br>

        مطمئن شو Railway فعال است.

        </div>

        `;

    }

}



async function addWebsite(){


const title =
document.getElementById("titleInput").value.trim();


const url =
document.getElementById("urlInput").value.trim();


const description =
document.getElementById("descriptionInput").value.trim();



if(!title || !url){

alert("عنوان و آدرس الزامی است");

return;

}



try{


const response = await fetch(
API_URL + "/api/websites",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

title:title,

url:url,

description:description

})


});


if(!response.ok){

throw new Error();

}



alert("سایت ذخیره شد");


document.getElementById("titleInput").value="";
document.getElementById("urlInput").value="";
document.getElementById("descriptionInput").value="";


loadWebsites();


}

catch(error){

alert("خطا در ذخیره سایت");

}


}async function deleteWebsite(id){

    if(!confirm("آیا مطمئنی می‌خواهی حذف کنی؟")){
        return;
    }


    try{


        const response = await fetch(
            API_URL + "/api/websites/" + id,
            {
                method:"DELETE"
            }
        );


        if(!response.ok){
            throw new Error();
        }


        alert("سایت حذف شد");


        loadWebsites();


    }
    catch(error){

        alert("خطا در حذف سایت");

    }

}




async function editWebsite(id){


    const title = prompt(
        "عنوان جدید را وارد کن:"
    );


    if(title === null){
        return;
    }


    const url = prompt(
        "آدرس جدید را وارد کن:"
    );


    if(url === null){
        return;
    }



    const description = prompt(
        "توضیحات جدید:"
    );



    try{


        const response = await fetch(
            API_URL + "/api/websites/" + id,
            {

                method:"PUT",

                headers:{
                    "Content-Type":
                    "application/json"
                },


                body:JSON.stringify({

                    title:title,

                    url:url,

                    description:description || ""

                })

            }
        );



        if(!response.ok){

            throw new Error();

        }



        alert("ویرایش شد");


        loadWebsites();



    }
    catch(error){

        alert("خطا در ویرایش");

    }


}





function escapeHTML(text){

    return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



window.onload = function(){

    loadWebsites();

};


</script>


</body>

</html>
